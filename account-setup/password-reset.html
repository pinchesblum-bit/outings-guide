<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your Outings Guide password</title></head>
<body style="margin:0;padding:28px 16px;background:#edf7f4;font-family:Arial,sans-serif;color:#234349">
<div style="max-width:480px;margin:auto;padding:28px;background:#fffdf7;border-radius:12px">
<h1 style="font-size:24px">Reset your Outings Guide password</h1>
<p style="font-size:16px;line-height:1.6">Enter this code on Outings Guide to choose a new password:</p>
<p style="font:32px monospace;letter-spacing:6px;text-align:center">{{ .Token }}</p>
<p style="font-size:16px;line-height:1.6">This code expires in 10 minutes. Do not share it with anyone.</p>
<p style="font-size:14px;line-height:1.6">If you did not request a password reset, you can ignore this email. Your password will stay the same.</p>
</div></body></html>
